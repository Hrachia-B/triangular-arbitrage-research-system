# Research-only Binance Spot public-market-data observer.
# There is intentionally no API key and no live-trading setting.

exchange: binance

run:
  duration_minutes: 60
  checkpoint_every_minutes: 60

discovery:
  root_asset: USDT
  important_bridge_assets:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - DOGE
    - ADA
    - AVAX
    - LINK
    - TRX
    - LTC
    - BCH
    - DOT
    - MATIC
    - POL
  # Broad enough for meaningful research while keeping one bounded WS shard.
  max_symbols: 50
  # Directional cap: normally 25 complete forward/reverse triangle pairs.
  max_cycles: 50
  min_quote_volume: "0"
  min_quote_volume_usdt: "0"
  max_spread_bps: null
  min_top_of_book_notional: "0"
  require_usable_ticker_book: true
  exclude_assets: []
  exclude_symbol_patterns: []

order_book:
  # The simulator only retains 100 levels. A 100-level Binance snapshot costs
  # 5 request-weight units instead of 50 for a 1000-level snapshot.
  depth_levels: 100
  snapshot_limit: 100
  stream_interval_ms: 100
  max_streams_per_connection: 50
  stale_after_ms: 2000
  startup_timeout_seconds: 30

simulation:
  # Conservative taker fee per leg (0.1%).
  fee_rate: "0.001"
  fee_sensitivity_rates: ["0.001", "0.00075", "0.0005", "0.0002", "0.0001", "0.0"]
  start_sizes: ["10", "25", "50", "100"]
  latency_buckets_ms: [50, 100, 250, 500, 1000]
  # Pessimistic mode leaves leg 1 unchanged, then shocks legs 2 and 3.
  quantity_haircut: "0.25"
  extra_slippage_bps: "1"
  scan_interval_ms: 50
  # Avoid overlapping duplicate signals while the 1000 ms latency check runs.
  signal_cooldown_ms: 1000
  profit_threshold_bps: "0"

network:
  # Binance hosts dedicated to public market data; no account/order APIs.
  rest_base_url: https://data-api.binance.vision
  websocket_base_url: wss://data-stream.binance.vision:443
  request_timeout_seconds: 10
  max_retries: 5
  retry_base_delay_seconds: 0.5

output:
  output_dir: data
  log_level: INFO
  max_jsonl_bytes: 52428800
  log_backup_count: 3

decision:
  minimum_duration_minutes: 2880
  minimum_sample_size: 20
  stop_ghost_percentage: "99"
  repeated_positive_cycle_min_signals: 2
  minimum_positive_checkpoints: 2
  survival_buckets_ms: [50, 100]
  minimum_total_estimated_pnl: "0"
