# Research-only MEXC Spot V3 public-market-data observer.
# There are intentionally no API keys, account endpoints, or trading settings.

exchange: mexc

run:
  duration_minutes: 60
  checkpoint_every_minutes: 60

discovery:
  root_asset: USDT
  important_bridge_assets:
    - BTC
    - ETH
    - MX
    - SOL
    - XRP
    - DOGE
    - ADA
    - LINK
    - TRX
    - LTC
  # MEXC lists many thin markets. Require meaningful USDT-equivalent turnover,
  # a reasonably tight public ticker, and useful size on both top levels.
  min_quote_volume: "0"
  min_quote_volume_usdt: "100000"
  max_spread_bps: "50"
  min_top_of_book_notional: "50"
  require_usable_ticker_book: true
  exclude_assets: []
  # Case-insensitive shell globs matched against the normalized symbol name.
  exclude_symbol_patterns:
    - "*3L*"
    - "*3S*"
    - "*5L*"
    - "*5S*"
    - "*BULL*"
    - "*BEAR*"
  max_symbols: 50
  max_cycles: 50

order_book:
  depth_levels: 100
  snapshot_limit: 100
  stream_interval_ms: 100
  # Keep subscriptions bounded and leave headroom on each public connection.
  max_streams_per_connection: 30
  stale_after_ms: 2000
  startup_timeout_seconds: 30

simulation:
  # Conservative simulated taker fee per leg. Verify the actual account fee
  # page and trade history before drawing any execution conclusion.
  fee_rate: "0.001"
  fee_sensitivity_rates: ["0.001", "0.0005", "0.0002", "0.0001", "0.0"]
  start_sizes: ["10", "25", "50", "100"]
  latency_buckets_ms: [50, 100, 250, 500, 1000]
  quantity_haircut: "0.25"
  extra_slippage_bps: "1"
  scan_interval_ms: 50
  signal_cooldown_ms: 1000
  profit_threshold_bps: "0"

network:
  # Public MEXC Spot V3 REST and public protobuf WebSocket hosts only.
  rest_base_url: https://api.mexc.com
  websocket_base_url: wss://wbs-api.mexc.com/ws
  request_timeout_seconds: 10
  max_retries: 5
  retry_base_delay_seconds: 0.5

output:
  output_dir: data
  log_level: INFO
  max_jsonl_bytes: 52428800
  log_backup_count: 3

decision:
  # A 10-minute smoke test remains UNCLEAR here; the dedicated decision is for
  # a completed 48-hour evidence window.
  minimum_duration_minutes: 2880
  minimum_sample_size: 20
  stop_ghost_percentage: "99"
  repeated_positive_cycle_min_signals: 2
  minimum_positive_checkpoints: 2
  survival_buckets_ms: [50, 100]
  minimum_total_estimated_pnl: "0"
