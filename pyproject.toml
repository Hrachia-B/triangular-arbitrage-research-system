[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "triangular-arbitrage-system"
version = "0.1.0"
description = "Research-only, depth-aware Spot triangular-arbitrage observer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "PyYAML>=6,<7",
  "protobuf>=5,<7",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
tri-arb = "tri_arb.main:main"

[tool.setuptools.packages.find]
include = ["tri_arb*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
